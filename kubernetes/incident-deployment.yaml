# Kubernetes Deployment - Incident Service (THEORETICAL)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-service-deployment
  labels:
    app: incident-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: incident-service
  template:
    metadata:
      labels:
        app: incident-service
    spec:
      containers:
        - name: incident-service
          image: disaster-incident:latest
          ports:
            - containerPort: 3002
          envFrom:
            - secretRef:
                name: disaster-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
