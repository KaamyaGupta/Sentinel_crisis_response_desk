# Kubernetes Deployment - Auth Service (THEORETICAL)
# ----------------------------------------------------
# A Deployment tells Kubernetes to run N copies (replicas) of a pod.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-deployment
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: disaster-auth:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: disaster-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
