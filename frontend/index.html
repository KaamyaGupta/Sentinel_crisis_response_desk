<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disaster Response Coordination System</title>
  <!-- Google Font - clean, professional typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Top alert bar for success/error messages -->
  <div id="alert-box" class="alert" role="alert" aria-live="polite"></div>

  <!-- ========== AUTH SECTION (Login / Signup) ========== -->
  <section id="auth-section" class="auth-wrapper">
    <div class="auth-container">
      <header class="auth-brand">
        <div class="brand-icon" aria-hidden="true">🛡️</div>
        <h1>Disaster Response</h1>
        <p class="brand-tagline">Coordination System for emergency teams</p>
      </header>

      <div class="auth-card">
        <!-- Tab buttons to switch login / signup -->
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" data-tab="login">Log In</button>
          <button type="button" class="auth-tab" data-tab="signup">Sign Up</button>
        </div>

        <!-- Login form -->
        <div id="login-panel" class="auth-panel active">
          <form id="login-form" class="form">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required placeholder="you@example.com" autocomplete="email" />

            <label for="login-password">Password</label>
            <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password" />

            <button type="submit" class="btn btn-primary btn-block">Log In</button>
          </form>
        </div>

        <!-- Signup form -->
        <div id="signup-panel" class="auth-panel">
          <form id="signup-form" class="form">
            <label for="signup-name">Full Name</label>
            <input type="text" id="signup-name" required placeholder="Jane Coordinator" autocomplete="name" />

            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" required placeholder="you@example.com" autocomplete="email" />

            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" required minlength="6" placeholder="Min. 6 characters" autocomplete="new-password" />

            <button type="submit" class="btn btn-primary btn-block">Create Account</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== DASHBOARD (after login) ========== -->
  <section id="dashboard-section" class="dashboard hidden">
    <header class="dashboard-header">
      <div class="header-left">
        <span class="header-logo" aria-hidden="true">🛡️</span>
        <div>
          <h1>Incident Dashboard</h1>
          <p id="user-greeting" class="user-greeting">Welcome</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="report-incident-btn" class="btn btn-accent">+ Report Incident</button>
        <button type="button" id="logout-btn" class="btn btn-outline">Log Out</button>
      </div>
    </header>

    <main class="dashboard-main">
      <div class="stats-bar">
        <div class="stat-card">
          <span class="stat-label">System</span>
          <span class="stat-value">Live</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Role</span>
          <span class="stat-value">Coordinator</span>
        </div>
      </div>

      <h2 class="section-title">Active Incidents</h2>
      <div id="incidents-grid" class="incidents-grid"></div>
    </main>
  </section>

  <!-- ========== MODAL: Report new incident ========== -->
  <div id="report-modal" class="modal" role="dialog" aria-labelledby="modal-title" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Report New Incident</h2>
        <button type="button" id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      </div>
      <form id="incident-form" class="form">
        <label for="incident-title">Incident Title</label>
        <input type="text" id="incident-title" required placeholder="e.g. Flooding in Sector 4" />

        <label for="incident-description">Description</label>
        <textarea id="incident-description" required rows="4" placeholder="Describe the situation, affected areas, and immediate needs..."></textarea>

        <label for="incident-location">Location</label>
        <input type="text" id="incident-location" required placeholder="City, district, or coordinates" />

        <label for="incident-severity">Severity</label>
        <select id="incident-severity">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>

        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="btn btn-outline">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Report</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Load scripts in order: config → api helpers → app logic -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
